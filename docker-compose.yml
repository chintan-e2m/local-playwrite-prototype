# Teaming-lite prototype: a hosted server and two developer machines, on separate networks.
#
#   server-net   app (SaaS + Claude Code + plugin, no browser), mongo, s3, nginx
#   laptop-net   nginx, laptop-1, laptop-2 (runner + Chromium)
#
# The laptops reach the server only through nginx (wss/https); the app cannot reach them.
# UI: http://localhost:8080 (or https://localhost:8443, self-signed)
name: teaming-lite

services:
  # One-time setup, runs before everything else and exits. Creates what isn't committed:
  #   nginx/certs/server.{crt,key}  self-signed TLS for nginx (names: nginx, localhost, 127.0.0.1)
  #   s3/s3.json                    storage credentials, built from S3_ACCESS_KEY / S3_SECRET_KEY in .env
  # Existing files are kept; delete them to regenerate.
  setup:
    image: alpine:3.20
    env_file: .env
    volumes: ["./nginx/certs:/certs", "./s3:/s3"]
    command:
      - sh
      - -euc
      - |
        if [ ! -f /certs/server.crt ] || [ ! -f /certs/server.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=teaming-server" \
            -addext "subjectAltName=DNS:nginx,DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/server.key -out /certs/server.crt 2>/dev/null
          chmod 644 /certs/server.key
          echo "setup: created nginx/certs/server.crt"
        fi
        if [ ! -f /s3/s3.json ]; then
          printf '{"identities":[{"name":"teaming","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}\n' \
            "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /s3/s3.json
          echo "setup: created s3/s3.json"
        fi
        echo "setup: done"
    networks: [server-net]

  mongo:
    image: mongo:8
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    volumes: [mongo:/data/db]
    networks: [server-net]

  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.config=/config/s3.json", "-dir=/data", "-ip.bind=0.0.0.0"]
    volumes:
      - ./s3:/config:ro
      - s3:/data
    depends_on:
      setup: { condition: service_completed_successfully }
    networks: [server-net]

  app:
    build: { context: ., dockerfile: app/Dockerfile }
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/teaming
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8080
      PUBLIC_URL: http://localhost:8080
      SEED_RUNNERS: dev1@teaming.local:laptop-1:${LAPTOP1_TOKEN},dev2@teaming.local:laptop-2:${LAPTOP2_TOKEN}
    depends_on: [mongo, s3]
    restart: unless-stopped
    networks: [server-net]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports: ["8080:80", "8443:443"]
    depends_on:
      setup: { condition: service_completed_successfully }
      app: { condition: service_started }
    networks: [server-net, laptop-net]

  laptop-1:
    build: { context: ., dockerfile: runner/Dockerfile }
    environment:
      TEAMING_SERVER: https://nginx
      TEAMING_RUNNER_TOKEN: ${LAPTOP1_TOKEN}
      TEAMING_RUNNER_CAPACITY: "2"
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes: ["./nginx/certs:/certs:ro"]
    depends_on: [nginx]
    restart: unless-stopped
    networks: [laptop-net]

  laptop-2:
    build: { context: ., dockerfile: runner/Dockerfile }
    environment:
      TEAMING_SERVER: https://nginx
      TEAMING_RUNNER_TOKEN: ${LAPTOP2_TOKEN}
      TEAMING_RUNNER_CAPACITY: "2"
      NODE_EXTRA_CA_CERTS: /certs/server.crt
    volumes: ["./nginx/certs:/certs:ro"]
    depends_on: [nginx]
    restart: unless-stopped
    networks: [laptop-net]

networks:
  server-net: {}
  laptop-net: {}

volumes:
  mongo: {}
  s3: {}
