# TLS edge. The only way into the server network: browsers use :443 (and :80 for local
# convenience), runners connect out to wss://nginx/agent/ws.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen 443 ssl;
  server_name _;
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  client_max_body_size 2m;

  # Runner WebSocket: long-lived, idle between heartbeats (15 s).
  location = /agent/ws {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  # Server-sent events for the UI.
  location = /api/events {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Object storage on the same origin (local stand-in for R2/S3, so browsers need no CORS).
  # Pre-signed URLs are signed for this host; the Host header must reach storage unchanged.
  location /teaming/ {
    proxy_pass http://s3:8333;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    client_max_body_size 200m;
  }

  location / {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
